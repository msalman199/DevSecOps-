version: '3.8'
services:
  dvwa:
    image: vulnerables/web-dvwa
    container_name: test-webapp
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - MYSQL_HOSTNAME=db
      - MYSQL_DATABASE=dvwa
      - MYSQL_USERNAME=dvwa
      - MYSQL_PASSWORD=p@ssw0rd
    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: test-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=p@ssw0rd
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=p@ssw0rd
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
