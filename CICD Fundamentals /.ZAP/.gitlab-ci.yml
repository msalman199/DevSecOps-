# .gitlab-ci.yml
stages:
  - build
  - test
  - security-scan
  - quality-gate
  - deploy-staging
  - security-test
  - deploy-production

variables:
  DOCKER_DRIVER: overlay2
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

# Build Stage
build:
  stage: build
  image: node:16
  script:
    - npm install
    - npm run build
  artifacts:
    paths:
      - node_modules/
      - dist/
    expire_in: 1 hour
  only:
    - main
    - develop

# Unit Tests
unit-tests:
  stage: test
  image: node:16
  script:
    - npm install
    - npm test -- --coverage
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
  only:
    - main
    - develop

# OWASP Dependency Check
dependency-check:
  stage: security-scan
  image: owasp/dependency-check:latest
  script:
    - /usr/share/dependency-check/bin/dependency-check.sh 
      --project "$CI_PROJECT_NAME" 
      --scan . 
      --format HTML 
      --format JSON 
      --out ./dependency-check-report
  artifacts:
    paths:
      - dependency-check-report/
    reports:
      junit: dependency-check-report/dependency-check-junit.xml
    expire_in: 1 week
  allow_failure: true
  only:
    - main
    - develop

# SonarQube Analysis
sonarqube-check:
  stage: security-scan
  image: 
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
      -Dsonar.projectKey=devsecops-demo
      -Dsonar.sources=.
      -Dsonar.host.url=http://sonarqube:9000
      -Dsonar.login=$SONAR_TOKEN
      -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
  allow_failure: true
  only:
    - main
    - develop

# Quality Gate Check
quality-gate:
  stage: quality-gate
  image: curlimages/curl:latest
  script:
    - |
      # Wait for SonarQube analysis to complete
      sleep 30
      
      # Check quality gate status
      QUALITY_GATE_STATUS=$(curl -s -u $SONAR_TOKEN: \
        "http://sonarqube:9000/api/qualitygates/project_status?projectKey=devsecops-demo" \
        | grep -o '"status":"[^"]*"' | cut -d'"' -f4)
      
      echo "Quality Gate Status: $QUALITY_GATE_STATUS"
      
      if [ "$QUALITY_GATE_STATUS" != "OK" ]; then
        echo "Quality gate failed!"
        exit 1
      fi
      
      echo "Quality gate passed!"
  dependencies:
    - sonarqube-check
  only:
    - main
    - develop

# Deploy to Staging
deploy-staging:
  stage: deploy-staging
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Building Docker image for staging..."
    - docker build -t $CI_PROJECT_NAME:staging .
    - echo "Deploying to staging environment..."
    - docker run -d --name staging-app -p 3001:3000 $CI_PROJECT_NAME:staging
    - echo "Application deployed to staging: http://localhost:3001"
  environment:
    name: staging
    url: http://localhost:3001
  dependencies:
    - build
    - quality-gate
  only:
    - main
    - develop

# ZAP Security Testing
zap-security-test:
  stage: security-test
  image: owasp/zap2docker-stable:latest
  script:
    - mkdir -p /zap/wrk
    - |
      # Wait for staging deployment
      sleep 60
      
      # Run ZAP baseline scan
      zap-baseline.py -t http://staging-app:3000 \
        -J zap-report.json \
        -r zap-report.html \
        || true
  artifacts:
    paths:
      - zap-report.html
      - zap-report.json
    expire_in: 1 week
  dependencies:
    - deploy-staging
  allow_failure: true
  only:
    - main

# Deploy to Production
deploy-production:
  stage: deploy-production
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Building Docker image for production..."
    - docker build -t $CI_PROJECT_NAME:production .
    - echo "Deploying to production environment..."
    - docker run -d --name production-app -p 3000:3000 $CI_PROJECT_NAME:production
    - echo "Application deployed to production: http://localhost:3000"
  environment:
    name: production
    url: http://localhost:3000
  dependencies:
    - zap-security-test
  when: manual
  only:
    - main
