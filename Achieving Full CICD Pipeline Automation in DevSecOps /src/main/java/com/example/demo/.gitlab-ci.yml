stages:
  - build
  - test
  - security-scan
  - build-image
  - deploy-staging
  - security-test
  - deploy-production
  - monitor

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_DRIVER: overlay2
  APP_NAME: "devsecops-demo"
  STAGING_URL: "http://staging.example.com"
  PRODUCTION_URL: "http://production.example.com"

cache:
  paths:
    - .m2/repository/

# Build Stage
build:
  stage: build
  image: maven:3.8.1-openjdk-11
  script:
    - mvn clean compile
  artifacts:
    paths:
      - target/
    expire_in: 1 hour

# Unit Test Stage
unit-test:
  stage: test
  image: maven:3.8.1-openjdk-11
  script:
    - mvn test
  artifacts:
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
  coverage: '/Total.*?([0-9]{1,3})%/'

# OWASP Dependency Check
dependency-check:
  stage: security-scan
  image: owasp/dependency-check:latest
  script:
    - /usr/share/dependency-check/bin/dependency-check.sh 
      --project "$APP_NAME" 
      --scan . 
      --format XML 
      --format HTML 
      --out dependency-check-report
  artifacts:
    paths:
      - dependency-check-report/
    expire_in: 1 week
  allow_failure: true

# Static Code Analysis (Checkmarx Alternative - SonarQube)
sast-scan:
  stage: security-scan
  image: sonarsource/sonar-scanner-cli:latest
  script:
    - sonar-scanner 
      -Dsonar.projectKey=$APP_NAME 
      -Dsonar.sources=src/main/java 
      -Dsonar.host.url=http://sonarqube:9000 
      -Dsonar.login=$SONAR_TOKEN
  allow_failure: true

# Build Docker Image
build-docker:
  stage: build-image
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - mvn package -DskipTests
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  dependencies:
    - build

# Deploy to Staging
deploy-staging:
  stage: deploy-staging
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    - docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker stop staging-app || true
    - docker rm staging-app || true
    - docker run -d --name staging-app -p 8081:8080 $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - sleep 30
    - curl -f http://localhost:8081/health || exit 1
  environment:
    name: staging
    url: http://localhost:8081
  dependencies:
    - build-docker

# ZAP Security Testing
zap-security-test:
  stage: security-test
  image: owasp/zap2docker-stable:latest
  script:
    - mkdir -p zap-reports
    - zap-baseline.py -t http://localhost:8081 -J zap-report.json -r zap-report.html
  artifacts:
    paths:
      - zap-reports/
    expire_in: 1 week
  dependencies:
    - deploy-staging
  allow_failure: true

# Deploy to Production
deploy-production:
  stage: deploy-production
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    - docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker stop production-app || true
    - docker rm production-app || true
    - docker run -d --name production-app -p 8080:8080 $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - sleep 30
    - curl -f http://localhost:8080/health || exit 1
  environment:
    name: production
    url: http://localhost:8080
  when: manual
  dependencies:
    - build-docker
  only:
    - main

# Setup Monitoring
setup-monitoring:
  stage: monitor
  image: alpine:latest
  script:
    - echo "Setting up monitoring for production deployment"
    - echo "Prometheus metrics endpoint: http://localhost:8080/actuator/prometheus"
    - echo "Grafana dashboard: http://localhost:3000"
  dependencies:
    - deploy-production
  only:
    - main
