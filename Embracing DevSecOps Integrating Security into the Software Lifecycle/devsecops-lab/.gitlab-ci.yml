stages:
  - security-scan
  - build
  - test
  - security-test
  - deploy

variables:
  DOCKER_DRIVER: overlay2

# Security scanning stage
sast:
  stage: security-scan
  image: python:3.9
  script:
    - pip install bandit safety
    - bandit -r src/ -f json -o bandit-report.json || true
    - safety check --json --output safety-report.json || true
  artifacts:
    reports:
      sast: bandit-report.json
    paths:
      - bandit-report.json
      - safety-report.json
    expire_in: 1 week

# Build stage
build:
  stage: build
  image: python:3.9
  script:
    - pip install -r requirements.txt
    - python -m py_compile src/app.py
  artifacts:
    paths:
      - src/
    expire_in: 1 hour

# Test stage
test:
  stage: test
  image: python:3.9
  script:
    - pip install pytest flask
    - python -m pytest tests/ -v
  dependencies:
    - build

# Security testing stage
security-test:
  stage: security-test
  image: python:3.9
  script:
    - pip install requests
    - python security/security_tests.py
  dependencies:
    - build

# Deploy stage
deploy:
  stage: deploy
  image: python:3.9
  script:
    - echo "Deploying application..."
    - python src/app.py &
  only:
    - main
