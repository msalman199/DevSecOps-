stages:
  - security-scan
  - build
  - test
  - security-test
  - compliance-check
  - privacy-check
  - deploy

variables:
  DOCKER_DRIVER: overlay2

# Static Application Security Testing
sast:
  stage: security-scan
  image: python:3.9
  before_script:
    - pip install bandit safety
  script:
    - bandit -r src/ -f json -o bandit-report.json || true
    - safety check --json --output safety-report.json || true
  artifacts:
    reports:
      sast: bandit-report.json
    paths:
      - bandit-report.json
      - safety-report.json
    expire_in: 1 week

# Dependency scanning
dependency-scan:
  stage: security-scan
  image: python:3.9
  script:
    - pip install safety
    - safety check --json --output dependency-scan.json || true
  artifacts:
    paths:
      - dependency-scan.json
    expire_in: 1 week

# Build stage
build:
  stage: build
  image: python:3.9
  script:
    - pip install -r requirements.txt
    - python -m py_compile src/app.py
  artifacts:
    paths:
      - src/
    expire_in: 1 hour

# Unit tests
test:
  stage: test
  image: python:3.9
  script:
    - pip install pytest flask
    - python -m pytest tests/ -v || true
  dependencies:
    - build

# Security testing
security-test:
  stage: security-test
  image: python:3.9
  script:
    - pip install requests
    - python security/security_tests.py
  dependencies:
    - build
  allow_failure: true

# Compliance checking
compliance-check:
  stage: compliance-check
  image: ubuntu:20.04
  before_script:
    - apt-get update
    - apt-get install -y libopenscap8 openscap-utils wget unzip
  script:
    - cd security && ./compliance_scan.sh || true
  artifacts:
    paths:
      - security/compliance-results/
    expire_in: 1 week
  allow_failure: true

# Privacy compliance check
privacy-check:
  stage: privacy-check
  image: ubuntu:20.04
  before_script:
    - apt-get update
    - apt-get install -y curl
    - curl https://omnitruck.chef.io/install.sh | bash -s -- -P inspec
  script:
    - cd security && ./privacy_check.sh || true
  artifacts:
    paths:
      - security/privacy-report.html
      - security/privacy-results.json
    expire_in: 1 week
  allow_failure: true

# Deploy stage
deploy:
  stage: deploy
  image: python:3.9
  script:
    - echo "Deploying application with security checks completed..."
    - python src/app.py &
  only:
    - main
  dependencies:
    - build
    - test
    - security-test
