---
- name: Configure Web Servers
  hosts: webservers
  become: yes
  vars_files:
    - ../vault/secrets.yml
  vars:
    app_name: "devsecops-webapp"
    app_port: 8080
    nginx_port: 80
    
  tasks:
    - name: Update system packages
      yum:
        name: "*"
        state: latest
        update_cache: yes
      tags: [system, updates]

    - name: Install required packages
      yum:
        name:
          - nginx
          - python3
          - python3-pip
          - git
          - htop
          - curl
          - wget
        state: present
      tags: [packages]

    - name: Install Python packages
      pip:
        name:
          - flask
          - gunicorn
          - requests
        executable: pip3
      tags: [python]

    - name: Create application user
      user:
        name: "{{ app_name }}"
        system: yes
        shell: /bin/bash
        home: "/opt/{{ app_name }}"
        create_home: yes
      tags: [users]

    - name: Create application directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_name }}"
        group: "{{ app_name }}"
        mode: '0755'
      loop:
        - "/opt/{{ app_name }}/app"
        - "/opt/{{ app_name }}/logs"
        - "/opt/{{ app_name }}/config"
      tags: [directories]

    - name: Create Flask application
      copy:
        content: |
          from flask import Flask, jsonify
          import os
          
          app = Flask(__name__)
          app.config['SECRET_KEY'] = '{{ app_secret_key }}'
          
          @app.route('/')
          def home():
              return jsonify({
                  'message': 'DevSecOps Lab Application',
                  'status': 'running',
                  'environment': 'production'
              })
          
          @app.route('/health')
          def health():
              return jsonify({'status': 'healthy'})
          
          if __name__ == '__main__':
              app.run(host='0.0.0.0', port={{ app_port }})
        dest: "/opt/{{ app_name }}/app/app.py"
        owner: "{{ app_name }}"
        group: "{{ app_name }}"
        mode: '0644'
      tags: [application]

    - name: Create Gunicorn configuration
      copy:
        content: |
          bind = "127.0.0.1:{{ app_port }}"
          workers = 2
          worker_class = "sync"
          worker_connections = 1000
          max_requests = 1000
          max_requests_jitter = 100
          timeout = 30
          keepalive = 2
          user = "{{ app_name }}"
          group = "{{ app_name }}"
          tmp_upload_dir = None
          logfile = "/opt/{{ app_name }}/logs/gunicorn.log"
          loglevel = "info"
          accesslog = "/opt/{{ app_name }}/logs/access.log"
          access_log_format = '%(h)s %(l)s %(u)s %(t)s "%(r)s" %(s)s %(b)s "%(f)s" "%(a)s"'
        dest: "/opt/{{ app_name }}/config/gunicorn.conf.py"
        owner: "{{ app_name }}"
        group: "{{ app_name }}"
        mode: '0644'
      tags: [configuration]

    - name: Create systemd service file
      copy:
        content: |
          [Unit]
          Description={{ app_name }} Flask Application
          After=network.target
          
          [Service]
          Type=exec
          User={{ app_name }}
          Group={{ app_name }}
          WorkingDirectory=/opt/{{ app_name }}/app
          Environment=PATH=/usr/local/bin:/usr/bin:/bin
          ExecStart=/usr/local/bin/gunicorn --config /opt/{{ app_name }}/config/gunicorn.conf.py app:app
          ExecReload=/bin/kill -s HUP $MAINPID
          Restart=always
          RestartSec=3
          
          [Install]
          WantedBy=multi-user.target
        dest: "/etc/systemd/system/{{ app_name }}.service"
        mode: '0644'
      notify: reload systemd
      tags: [systemd]

    - name: Configure Nginx
      copy:
        content: |
          server {
              listen {{ nginx_port }};
              server_name _;
              
              location / {
                  proxy_pass http://127.0.0.1:{{ app_port }};
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
              
              location /health {
                  proxy_pass http://127.0.0.1:{{ app_port }}/health;
                  access_log off;
              }
          }
        dest: "/etc/nginx/conf.d/{{ app_name }}.conf"
        backup: yes
      notify: restart nginx
      tags: [nginx]

    - name: Remove default Nginx configuration
      file:
        path: /etc/nginx/conf.d/default.conf
        state: absent
      notify: restart nginx
      tags: [nginx]

    - name: Start and enable services
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
        daemon_reload: yes
      loop:
        - nginx
        - "{{ app_name }}"
      tags: [services]

    - name: Configure firewall
      firewalld:
        port: "{{ item }}"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - "{{ nginx_port }}/tcp"
        - "22/tcp"
      ignore_errors: yes
      tags: [firewall]

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes

    - name: restart nginx
      systemd:
        name: nginx
        state: restarted

    - name: restart application
      systemd:
        name: "{{ app_name }}"
        state: restarted
