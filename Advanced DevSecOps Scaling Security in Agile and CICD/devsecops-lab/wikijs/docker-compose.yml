version: '3.8'

services:
  wikijs-db:
    image: postgres:13
    environment:
      POSTGRES_DB: wiki
      POSTGRES_PASSWORD: wikijsrocks
      POSTGRES_USER: wikijs
    logging:
      driver: "none"
    restart: unless-stopped
    volumes:
      - wikijs-db-data:/var/lib/postgresql/data
    networks:
      - wikijs-network

  wikijs:
    image: ghcr.io/requarks/wiki:2
    depends_on:
      - wikijs-db
    environment:
      DB_TYPE: postgres
      DB_HOST: wikijs-db
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: wikijsrocks
      DB_NAME: wiki
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - wikijs-network
    volumes:
      - wikijs-data:/wiki/data

volumes:
  wikijs-db-data:
  wikijs-data:

networks:
  wikijs-network:
    driver: bridge
